schema: spec-driven

# Project context for OpenSpec artifacts (proposals, designs, specs, tasks).
# The specs in openspec/specs/ describe ZebSerialWifi as built on 2026-10-31 (main at 2eb08d6).
# Where this file, a spec, README.md or docs/superpowers/* disagree with the code, the code wins: fix the document.
context: |
  ## Purpose
  ZebSerialWifi is a Wi-Fi to RS-232 bridge for Zebra label printers that have a DB9 serial port but no network
  connection. It plugs into the printer's DB9 and appears on the network as an ordinary network printer: raw TCP
  on port 9100, POST /pstprnt over HTTP, advertised over mDNS/Bonjour, with a web UI for status and settings.
  Public repository github.com/Bwooce/ZebSerialWifi, MIT licence. One unit is built and in use.

  ## Hardware
  - Seeed XIAO ESP32-C6 (4 MB flash). UART TX on D5 (GPIO23), RX on D3 (GPIO21) through a Schottky diode
    (anode at D3, band at the module), RX internal pull-up on. LED GPIO15, BOOT button GPIO9, RF switch GPIO3/GPIO14.
  - MAX3232 RS-232 module, currently an HW-044 clone ("MAX3232 ESE", female right-angle DB9, 4-pin header
    GND/RXD/TXD/VCC). Its charge pump only runs at 5 V, so VCC comes from the XIAO 5V pad and the diode protects D3.
  - Optional power from the printer's DB9 pin 9 (+5 V, 0.75 A for the whole port) by a wire to the XIAO 5V pad.
  - A straight-through male-male DB9 gender changer between the female module and the printer's female socket.
  - Bench printer: Zebra GX430t, firmware V56.17.16Z, 300 dpi, ZPL. XON/XOFF handshake only.
  - Case: two-part PETG print (tray + lid, snap clips), OpenSCAD in enclosure/, sliced for a Bambu Lab H2D in print/.

  ## Repository layout
  - firmware/: ESP-IDF 6.1 project, target esp32c6. firmware/main/*.c, Kconfig.projbuild, partitions.csv,
    sdkconfig.defaults. Components: espressif/mdns (manifest "^1.8") and bwooce/esp_iot_log (manifest pins a git
    commit). Host tests in firmware/test_host/ cover the pure parsers (zpl_status, urlcodec, netcfg, log_line,
    test_label, temp_alarm).
  - tools/cable-labels.html: a stand-alone browser page that prints cable flag labels through /pstprnt.
  - enclosure/: zebserial_case.scad, build.sh, controls.sh, wallprobe.py, stlinfo.py, out/*.stl, renders/*.png.
    enclosure/reference/ is gitignored (datasheets, Seeed KiCad/STEP), so it is not in the repository.
  - print/: Bambu Studio CLI slicing (run_slice.sh, resolve_profile.py, *overrides*.json) and the sliced 3MFs.
  - assets/logo/: the striped mark (SVG sources and their generators); the web UI and the case logo inlay derive
    from it, as the Reference artefacts list below says.
  - docs/superpowers/: the 2026-10-07 design and plan, older than the code; docs/papercuts/: friction log.

  ## Reference artefacts
  The specs rely on these files and do not restate them. Normative artefacts are inputs a rebuild copies as they are;
  the specs plus these files are enough to rebuild the bridge. Informative artefacts explain and record; where one
  disagrees with the code or a spec, the code wins and the document is fixed.

  Normative:
  - enclosure/zebserial_case.scad: the case geometry. Its parameters are specified in the enclosure spec.
  - enclosure/build.sh (STL export, renders, parameter warnings, interference checks, logo check, wall probe, with
    the wall-probe whitelists ALLOW_tray and ALLOW_lid), enclosure/controls.sh (the positive and negative controls,
    one `ctl` line each), enclosure/wallprobe.py and enclosure/stlinfo.py: the case gates. The enclosure spec states
    what they must catch; the scripts hold the exact checks, offsets and whitelist boxes.
  - assets/logo/zebserial-mark.svg: the mark. firmware/main/web.c LOGO_D is its path, copied by hand; the inline page
    logo (LOGO_SVG, currentColor) and /favicon.svg (s_favicon, a self-coloured SVG built in web.c, #222, #ddd in dark
    mode) are both built from LOGO_D, so no SVG file is served. The case inlay imports zebserial-mark-deboss.svg.
    make_logo.py generates the SVGs (zebserial-mark-lid.svg and zebserial-full.svg are generated too, and nothing in
    the build uses them); make_icons.py renders firmware/main/icons/favicon.ico and apple-touch-icon.png from
    zebserial-mark.svg. The two icon files are served as they are (EMBED_FILES in firmware/main/CMakeLists.txt).
  - firmware/main/test_label.c test_label_zpl(): the source of truth for the test label layout (positions, sizes,
    fonts, what is left out on a small label). The web-ui spec states what the label must show; the code holds the
    dot-level layout.
  - firmware/test_host/test_main.c, firmware/test_host/Makefile and firmware/test_host/fixtures/gx430t_hh.bin (a
    GX430t ^HH reply): the host test suite and its expected parser output. It compiles test_main.c with
    firmware/main/zpl_status.c, urlcodec.c, netcfg.c, log_line.c, test_label.c and temp_alarm.c and their headers
    zpl_status.h, urlcodec.h, netcfg.h, log_line.h, test_label.h, temp_alarm.h and zpl_units.h, so a rebuild with
    the same parser interfaces can run it unchanged.
  - firmware/sdkconfig.defaults and firmware/partitions.csv: the build configuration and flash layout. The symbols
    in sdkconfig.defaults, and the spec that relies on each: CONFIG_IDF_TARGET="esp32c6" and
    CONFIG_ESPTOOLPY_FLASHSIZE_4MB (Hardware, this file); CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG (device-settings,
    Console); CONFIG_HTTPD_MAX_REQ_HDR_LEN=1024 and CONFIG_LWIP_MAX_SOCKETS=16 (Constraints, this file);
    CONFIG_PARTITION_TABLE_CUSTOM with CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv" and
    CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE (ota-updates); CONFIG_COMPILER_OPTIMIZATION_SIZE (optimise for size,
    to keep the app image small against its 0x1E0000 slot); CONFIG_LWIP_IPV6 and CONFIG_LWIP_IPV6_AUTOCONFIG
    (print-bridge dual-stack listener, wifi-provisioning IPv6 addresses); CONFIG_UART_ISR_IN_IRAM (the UART driver then
    allocates the printer link's interrupt with ESP_INTR_FLAG_IRAM, so it runs while the flash cache is off, for
    example during an OTA write or an NVS commit).
    Every other symbol keeps the ESP-IDF default: log level info, CPU 160 MHz, FreeRTOS tick 100 Hz, one core,
    and the default Wi-Fi buffers and mDNS options.
  - The components named in firmware/main/idf_component.yml: bwooce/esp_iot_log from
    github.com/Bwooce/esp-iot-log (path esp-idf) at the commit the manifest pins, and espressif/mdns.
  - firmware/main/icons/favicon.ico and apple-touch-icon.png, served as they are.

  Informative:
  - README.md: the user's guide. Parts and Wiring (pins, the diode, the optional pull-up resistors, power from pin
    9), the printer serial settings, setup, troubleshooting, and fit notes for the case.
  - enclosure/README.md: the case design record. Coordinates, revision history, measurements and what was assumed,
    the interference checks and controls table, the fit-check list (measure before printing) and the concerns to
    check before printing.
  - print/README.md: the slicing settings and why each was chosen, print times and weights, and how to rebuild the
    3MFs.
  - .github/workflows/ci.yml: what CI runs on each push and pull request (OpenSpec validate, host tests, firmware
    build, page JavaScript check, the enclosure gates when enclosure/ or the workflow changes, and the spec drift
    warning).
  - tools/check_page_js.py: extracts each page script from web.c and tools/cable-labels.html and runs node --check
    on it (Quality gates below).
  - docs/superpowers/ and docs/papercuts/: the original design and plan, and the friction log.

  Versions. These are observed outcomes, not requirements. The firmware was built and tested with ESP-IDF 6.1.0,
  espressif/mdns 1.14.0 (firmware/dependencies.lock) and bwooce/esp_iot_log at commit
  e6a5a22aa21f7f4be1f956563619fbe1f11b0544. The case STLs were made with the OpenSCAD 2026.06.12 nightly and the
  manifold backend. The 3MFs in print/ were sliced with Bambu Studio 02.08.03.66 (the Application entry in their
  3D/3dmodel.model). The specs were validated with OpenSpec 1.16.0, the version CI pins.

  ## Constraints
  - Flash 4 MB. partitions.csv: nvs 0x9000 size 0x6000, otadata 0xf000 0x2000, phy_init 0x11000 0x1000,
    ota_0 0x20000 0x1E0000, ota_1 0x200000 0x1E0000. An app image must fit 0x1E0000 (1,966,080 bytes).
    The partition table and bootloader change only over USB (idf.py flash); NVS keeps offset 0x9000.
  - httpd task stack 8192 bytes (web.c web_start(): cfg.stack_size), max_open_sockets 4, lru_purge_enable,
    max_uri_handlers 24 with 22 registered (a third new handler needs the limit raised). One server task
    runs every handler, so a long handler (an HTTP print job, an OTA upload) holds up every other page.
    Handlers must not put large buffers on the stack. CONFIG_HTTPD_MAX_REQ_HDR_LEN 1024, CONFIG_LWIP_MAX_SOCKETS 16.
  - One printer link: the UART is shared by the TCP 9100 bridge, HTTP print jobs and the status poller, one at a
    time. Only ZPL is generated by the bridge; EPL, CPCL and line-print printers get pass-through only.
  - Wi-Fi power save is switched off (WIFI_PS_NONE, for latency) when the station starts with a saved network
    (wifi_prov.c); the setup path leaves the ESP-IDF default. CPU 160 MHz (sdkconfig).
  - firmware/sdkconfig and firmware/managed_components/ are generated and gitignored; a spec that cites them
    refers to a configured build tree (idf.py reconfigure creates them from sdkconfig.defaults and the manifest).
  - The case outside top must stay within max_above = 25.0 mm above the RS-232 PCB top.

  ## Quality gates (run the ones a change touches; report results, never claim an unrun gate)
  - Host tests: make -C firmware/test_host (clang, -Wall -Wextra -Werror, ASan and UBSan). It must end
    "N checks, 0 failures". Add checks with every parser change; expected values trace to printer output or Zebra manuals,
    not to values this code computed.
  - Firmware build: cd firmware && idf.py build. ESP-IDF's default flags make warnings errors (-Werror, with
    ESP-IDF's own -Wno-error exceptions); the project sets no CONFIG_COMPILER_DISABLE_DEFAULT_ERRORS.
  - Page JavaScript embedded as C string literals in firmware/main/web.c: extract each script and run node --check
    on it before pushing (an apostrophe inside a C string once broke a served page). python3 tools/check_page_js.py
    does this for web.c and tools/cable-labels.html, and CI runs it (.github/workflows/ci.yml).
  - Before testing or reporting on a device, match the running firmware's version string to the commit built.
  - Enclosure: enclosure/build.sh (STL export, renders, interference checks, logo check, wall probe) and
    enclosure/controls.sh (the positive and negative controls, one `ctl` line each) must both print zero failures. build.sh overwrites
    out/ and renders/, which are tracked: run it only when the STLs are meant to change, and commit them together.
  - Slicing runs only on a Mac with Bambu Studio (not every checkout has it); see the slicing-and-printing spec.

  ## Conventions
  - House style for prose, comments, specs and commit messages: plain precise English, short sentences, metric
    units, British/Australian spelling (behaviour, colour, centre, licence), no exclamation marks.
  - Commit messages: one plain sentence or clause saying what changed and why, no type prefix, often naming the
    area first ("Cable page: set the cable diameter, ...", "POST /pstprnt: print the request body, ...",
    "Case revision 5: ..."). A body, if any, explains reasons. No AI attribution or session lines.
  - Commit with explicit pathspecs. Push at milestones. The STLs and the 3MFs are regenerated, never hand-edited.
  - The device is "the bridge", the Zebra is "the printer", a TCP/HTTP peer is "the client".
  - Specs: each requirement cites its source in a **Source**: line (file plus function, constant or parameter).
  - Known deviations: a requirement states the intended behaviour. Where the code does not yet meet it, the spec
    says so in a "### Known deviations" list under its "## Notes" section, one bullet per gap with file:line, and a
    scenario that the gap breaks says "currently" and points there. A fix removes the bullet in the same commit.
  - Terminology: "setup network" / "setup access point" (as the code and pages say), not "set-up".

rules:
  proposal:
    - Say which capability specs the change touches; a change to behaviour updates those specs in the same commit.
  specs:
    - Every requirement has a **Source** line naming the file and the function, constant, parameter or route.
    - Quote numbers from a named define, Kconfig symbol or SCAD parameter and cite it; do not retype a value with no name.
    - Requirements state intended behaviour; record any gap between it and the code under Notes, Known deviations.
    - One spec owns each behaviour; others refer to it by capability and requirement name instead of restating it.
    - "Use 'setup' (not 'set-up'), metric units and British/Australian spelling; no exclamation marks."
  design:
    - Name the quality gates the change must pass (host tests, idf.py build, node --check, enclosure build.sh and controls.sh).
  tasks:
    - "Include a task to update the affected specs, and in the other direction a task to change the code when a spec change alters behaviour."
    - Include a task to remove a Known deviations bullet when the change fixes it.
